nh = không có gì.","topic":"Phủ định","voice":"何もありません。","kind":"mcq"},{"book":"lesson7","page":2,"q":"「道がわかりません。」 nghĩa là gì?","opts":["Tôi không biết đường","Tôi đã đến nhà","Tôi ở trường","Tôi biết đường"],"a":0,"why":"道 = đường; わかりません = không biết / không hiểu.","topic":"Hỏi đường","voice":"道がわかりません。","kind":"mcq"}],"builders":[{"book":"lesson7","page":15,"vi":"Ở đằng kia có một cửa hàng bách hóa.","tokens":["あそこに","デパートが","あります。"],"why":"[địa điểm] に + [vật] が + あります。"},{"book":"lesson7","page":15,"vi":"Trong lớp không có học sinh.","tokens":["教室に","学生が","いません。"],"why":"Người: います/いません, vị trí tồn tại: に."},{"book":"lesson7","page":16,"vi":"TV ở tiền sảnh.","tokens":["テレビは","ロビーに","あります。"],"why":"[vật] は + [vị trí] に + あります。"},{"book":"lesson7","page":18,"vi":"Quyển sách nằm trên bàn.","tokens":["本は","机の上に","あります。"],"why":"の dùng nối bàn với từ chỉ vị trí 上."},{"book":"lesson7","page":19,"vi":"Trong cặp có gì?","tokens":["かばんのなかに","何が","ありますか。"],"why":"Hỏi đối tượng tồn tại: 何が ありますか."},{"book":"kanji","page":11,"vi":"Tôi uống nước.","tokens":["水を","飲みます。"],"why":"水を là tân ngữ, 飲みます là động từ."},{"book":"kanji","page":13,"vi":"Buổi sáng tôi ăn thịt.","tokens":["あさ","肉を","食べます。"],"why":"肉を = ăn thịt, 食べます = ăn."},{"book":"kanji","page":16,"vi":"Quyển sách này cũ.","tokens":["この本は","古いです。"],"why":"古い = cũ (tính từ -い)."},{"book":"kanji","page":19,"vi":"Tôi thức dậy lúc 7 giờ rưỡi.","tokens":["わたしは","７時半に","おきます。"],"why":"Thời điểm cụ thể thường được đánh dấu bằng に."},{"book":"listening","page":3,"vi":"Tôi đến từ Ấn Độ.","tokens":["インドから","来ました。"],"why":"から thể hiện điểm xuất phát; 来ました = đã đến."},{"book":"listening","page":8,"vi":"Đó là thẻ bệnh viện.","tokens":["病院の","カードです。"],"why":"の nối hai danh từ."},{"book":"listening","page":9,"vi":"Đây là sách của anh/chị Jan.","tokens":["これは","ジャンさんの","本です。"],"why":"の dùng đánh dấu sở hữu."}],"passages":[{"book":"listening","page":3,"title":"Buổi 01 · Đến từ đâu?","dialogue":"はじめまして。センです。インドから来ました。どうぞよろしくお願いします。","question":"センさんはどこから来ましたか。","options":["インド","タイ","フランス"],"a":0,"why":"「インドから来ました」 có nghĩa là đến từ Ấn Độ."},{"book":"listening","page":3,"title":"Buổi 01 · Quốc tịch","dialogue":"ジャンです。フランスから来ました。どうぞよろしく。","question":"ジャンさんはどこから来ましたか。","options":["インド","フランス","中国"],"a":1,"why":"フランスから来ました."},{"book":"listening","page":4,"title":"Buổi 01 · Nghề nghiệp","dialogue":"後藤さんは先生ですか。いいえ、医者です。ああ、わたしも医者です。","question":"後藤さんの仕事は何ですか。","options":["医者","先生","学生"],"a":0,"why":"いいえ、医者です。"},{"book":"listening","page":4,"title":"Buổi 01 · Tuổi","dialogue":"ミラーさん。失礼ですが、おいくつですか。二十八歳です。タイから来ました。","question":"ミラーさんは何歳ですか。","options":["十八歳","二十八歳","五十一歳"],"a":1,"why":"二十八歳です = 28 tuổi."},{"book":"listening","page":4,"title":"Buổi 01 · Tuổi của Masuda","dialogue":"あの方はどなたですか。益田さんです。神戸病院の医者です。おいくつですか。えーと、五十一歳です。","question":"益田さんは何歳ですか。","options":["二十八歳","五十一歳","八歳"],"a":1,"why":"五十一歳 = 51 tuổi."},{"book":"listening","page":8,"title":"Buổi 02 · Tạp chí","dialogue":"それは何ですか。雑誌です。何の雑誌ですか。車の雑誌です。","question":"何の雑誌ですか。","options":["車の雑誌","日本語の本","病院のカード"],"a":0,"why":"「車の雑誌です」 = tạp chí về xe."},{"book":"listening","page":8,"title":"Buổi 02 · Tấm thẻ","dialogue":"それは何ですか。これですか。カードです。何のカードですか。病院のカードです。","question":"何のカードですか。","options":["学校のカード","病院のカード","会社のカード"],"a":1,"why":"病院のカードです = thẻ bệnh viện."},{"book":"listening","page":9,"title":"Buổi 02 · Sở hữu","dialogue":"この本はだれのですか。これはジャンさんのです。ジャンさんの本です。","question":"この本はだれのですか。","options":["リンさん","ジャンさん","先生"],"a":1,"why":"ジャンさんの本です."},{"book":"lesson7","page":16,"title":"Bài 7 · Ở đâu có TV?","dialogue":"ロビーにテレビがあります。テレビはロビーにあります。","question":"テレビはどこにありますか。","options":["教室","ロビー","公園"],"a":1,"why":"ロビーにあります = ở tiền sảnh."},{"book":"lesson7","page":18,"title":"Bài 7 · Vị trí mũ","dialogue":"ぼうしはどこにありますか。いすの後ろにあります。","question":"ぼうしはどこにありますか。","options":["いすの上","いすの後ろ","机の下"],"a":1,"why":"いすの後ろ = phía sau ghế."}]};</script><script>
(()=>{'use strict';const D=window.NIHONGO_DATA;const $=(s,root=document)=>root.querySelector(s);const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));let page='dashboard',book='all',quizState=null,listenState=null,flashIndex=0,flashFlip=false,flashBook='kanji',buildIndex=0,buildPicked=[],buildResult=null,readerQuery='',readerBook='all';let store;try{store=JSON.parse(localStorage.getItem('nihongo_studio_v1'))||{history:[],flash:{}}}catch(e){store={history:[],flash:{}}};const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem('nihongo_studio_v1',JSON.stringify(store))}catch(e){}};const source=(bk,p)=>{const b=D.books.find(x=>x.id===bk);return `<div class="sourcebar"><span>📖 ${safe(b.title)} · Trang ${p}</span><a target="_blank" rel="noopener" href="${encodeURI(b.file)}#page=${p}">Mở trang PDF gốc ↗</a></div>`};const badge=(s)=>`<span class="tag">${safe(s)}</span>`;const btn=(s,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${s}</button>`;const bookName=id=>D.books.find(b=>b.id===id)?.title||id;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const setHeader=(t,s)=>{$('#pageTitle').textContent=t;$('#pageSub').textContent=s};const dom=$('#content');const record=(type,item,correct,answer)=>{store.history.unshift({date:new Date().toISOString(),type,book:item.book,page:item.page,topic:item.topic||type,correct,question:item.q||item.question||item.vi||'',answer:answer??''});store.history=store.history.slice(0,1000);persist()};const recent=()=>store.history;const counts=()=>({all:recent().length,correct:recent().filter(x=>x.correct).length,wrong:recent().filter(x=>!x.correct).length});function speak(t,rate=.86){if(!('speechSynthesis'in window))return toast('Trình duyệt này không hỗ trợ giọng đọc.');window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate;u.pitch=1;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}function toast(t){let n=$('.toast');if(n)n.remove();n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600)}function view(p){page=p;$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));if(p==='dashboard')dashboard();if(p==='quiz')quiz();if(p==='listen')listen();if(p==='flash')flash();if(p==='build')builder();if(p==='reader')reader();if(p==='progress')progress();window.scrollTo({top:0,behavior:'smooth'})}
function dashboard(){setHeader('Bảng điều khiển học tập','Một trung tâm luyện tập dựa trên 3 giáo trình N5');const c=counts(),rate=c.all?Math.round(c.correct/c.all*100):0;dom.innerHTML=`<section class="hero"><div><div class="mini">PERSONAL JAPANESE TRAINING</div><h2>毎日、少しずつ上達しよう。 ✨</h2><p>Mỗi ngày tiến bộ một chút: học chữ, nghe hiểu, ghép câu và kiểm tra. Mỗi câu sai được giải thích kèm liên kết về đúng trang giáo trình.</p>${btn('Bắt đầu luyện tập →','go-quiz','alt')}</div><div class="ji">日本語</div></section><div class="stats"><div class="stat"><div class="sticon">📚</div><strong>3</strong><small>Giáo trình PDF</small></div><div class="stat"><div class="sticon">📝</div><strong>${D.quiz.length}</strong><small>Câu kiểm tra</small></div><div class="stat"><div class="sticon">✅</div><strong>${rate}%</strong><small>Tỷ lệ đúng đã làm</small></div><div class="stat"><div class="sticon">⚡</div><strong>${c.all}</strong><small>Lượt trả lời đã lưu</small></div></div><h2 class="section-title">Chọn giáo trình của bạn</h2><div class="grid">${D.books.map((b,i)=>`<div class="card"><div class="book-icon">${['🎧','🈶','🏡'][i]}</div><div style="margin-bottom:9px">${badge(`${b.pages} trang`)}</div><h3>${safe(b.title)}</h3><p>${['Luyện nghe hội thoại, chọn ý đúng và phản xạ theo script của sách.','Ghi nhớ chữ, âm đọc, nghĩa, từ ghép; làm flashcard và tự đánh giá.','Bài 7: xác định vị trí, あります／います, trợ từ và ghép câu logic.'][i]}</p><div class="row">${btn('Luyện ngay','book-'+b.id)}${btn('Đọc sách','read-'+b.id,'alt')}</div></div>`).join('')}</div><h2 class="section-title">Công cụ luyện tập</h2><div class="grid">${[['🎯','Kiểm tra thích ứng','Chấm đúng–sai, xem lý do và chủ đề kiến thức','go-quiz'],['🔊','Nghe & shadowing','Nghe giọng Nhật tổng hợp, trả lời câu hỏi','go-listen'],['🧩','Ghép câu','Sắp xếp thành phần câu và hiểu trợ từ','go-build']].map(x=>`<div class="card"><div class="book-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p>${btn('Mở công cụ →',x[3],'alt')}</div>`).join('')}</div><p class="note" style="margin-top:20px">Ghi chú: dữ liệu tương tác là các câu được biên soạn theo nội dung từ PDF; tra cứu bao gồm văn bản trích xuất từ toàn bộ trang. Một số trang PDF chủ yếu là hình ảnh nên phần tìm kiếm văn bản có thể không đầy đủ; mở PDF để xem bản gốc.</p>`}
function quiz(){setHeader('Kiểm tra thông minh','Luyện theo từng sách, theo chủ đề hoặc ôn riêng lỗi sai');if(!quizState){dom.innerHTML=`<div class="card setup quiz-wrap"><h3>Thiết lập bài kiểm tra</h3><p>Lấy câu hỏi từ kho bài; sau mỗi lần trả lời, xem ngay phân tích và kiến thức liên quan.</p><div class="row"><div class="field"><label>Giáo trình</label><select id="quizBook"><option value="all">Cả 3 giáo trình</option>${D.books.map(b=>`<option value="${b.id}" ${book===b.id?'selected':''}>${safe(b.title)}</option>`).join('')}</select></div><div class="field"><label>Số câu</label><select id="quizCount">${[10,20,30,50,100].map(x=>`<option value="${x}" ${x===20?'selected':''}>${x} câu</option>`).join('')}</select></div><div class="field"><label>Chế độ</label><select id="quizMode"><option value="all">Luyện tập tổng hợp</option><option value="wrong">Ôn câu đã sai</option></select></div></div><div style="margin-top:20px">${btn('Bắt đầu làm bài →','start-quiz')}</div></div><h2 class="section-title">Các chuyên đề được luyện</h2><div class="filter">${[...new Set(D.quiz.map(x=>x.topic))].map(x=>`<span class="chip">${safe(x)}</span>`).join('')}</div>`;return}let s=quizState;if(s.idx>=s.items.length){const ok=s.answers.filter(x=>x?.correct).length;dom.innerHTML=`<div class="card quiz-wrap"><div class="mini" style="color:#6576ce">KẾT QUẢ BÀI KIỂM TRA</div><h2>Hoàn thành!</h2><div class="score">${ok}/${s.items.length}</div><p>Đúng ${Math.round(100*ok/s.items.length)}% · Sai ${s.items.length-ok} câu. Hãy ôn các kiến thức xuất hiện trong phần lỗi.</p><div class="row">${btn('Làm đề mới','reset-quiz')}${btn('Xem lỗi sai','go-progress','alt')}</div><h3 class="section-title">Tổng hợp lỗi trong lần luyện này</h3>${s.items.map((q,i)=>s.answers[i]?.correct?'':`<div class="reader-result"><span class="badgewrong">${safe(q.topic)}</span><p>${safe(q.q)}</p><div class="small muted">${safe(q.why)}</div>${source(q.book,q.page)}</div>`).join('')||'<p>Không có câu sai. Xuất sắc!</p>'}</div>`;return}const q=s.items[s.idx],ans=s.answers[s.idx],pct=Math.round((s.idx)/s.items.length*100);dom.innerHTML=`<div class="card quiz-wrap"><div class="row between quiz-head"><div>${badge(bookName(q.book))} <span class="muted small">${safe(q.topic)}</span></div><strong>Câu ${s.idx+1}/${s.items.length}</strong></div><div class="progress"><div style="width:${pct}%"></div></div><div class="question">${safe(q.q)}</div>${q.voice?`<div class="row"><button class="btn soft" data-act="speak-q">🔊 Nghe tiếng Nhật</button><span class="muted small">Giọng máy • có thể phát lại</span></div>`:''}<div style="margin-top:15px">${q.opts.map((o,i)=>`<button class="option ${ans?(i===q.a?'correct':i===ans.pick?'wrong':''):''}" data-act="pick-quiz" data-val="${i}" ${ans?'disabled':''}><span class="dot">${'ABCD'[i]}</span><span>${safe(o)}</span></button>`).join('')}</div>${ans?`<div class="feedback ${ans.correct?'ok':'bad'}"><strong>${ans.correct?'✓ Chính xác!':'✕ Chưa đúng.'}</strong><div>Đáp án: <strong>${safe(q.opts[q.a])}</strong></div><div><b>Vì sao?</b> ${safe(q.why)}</div><div><b>Kiến thức cần ôn:</b> ${safe(q.topic)}</div>${source(q.book,q.page)}</div><div style="margin-top:18px">${btn('Câu tiếp theo →','next-quiz')}</div>`:source(q.book,q.page)}</div>`}
function listen(){setHeader('Nghe hiểu & shadowing','Nghe hội thoại có đối chiếu script; chọn đáp án và luyện đọc đuổi');if(!listenState)listenState={idx:0,answers:{},show:false,speed:.83};let s=listenState,p=D.passages[s.idx],ans=s.answers[s.idx];dom.innerHTML=`<div class="card quiz-wrap"><div class="row between">${badge(bookName(p.book))}<strong>Đoạn ${s.idx+1}/${D.passages.length}</strong></div><h2 class="section-title">${safe(p.title)}</h2><div class="listenbox"><div class="row"><button class="btn" data-act="play-listen">▶ Nghe hội thoại</button><button class="btn alt" data-act="play-slow">🐢 Nghe chậm</button><button class="btn soft" data-act="toggle-script">${s.show?'Ẩn script':'Hiện script'}</button></div>${s.show?`<p class="bigj" lang="ja" style="line-height:1.95">${safe(p.dialogue)}</p>`:'<p class="small muted">Nghe trước và tự trả lời. Khi cần kiểm tra, hãy bật script.</p>'}<p class="note">Âm thanh: giọng đọc tổng hợp của trình duyệt, không phải bản audio phát hành kèm giáo trình.</p></div><div class="question" style="font-size:21px">${safe(p.question)}</div>${p.options.map((o,i)=>`<button class="option ${ans?(i===p.a?'correct':i===ans.pick?'wrong':''):''}" data-act="pick-listen" data-val="${i}" ${ans?'disabled':''}><span class="dot">${'ABC'[i]}</span>${safe(o)}</button>`).join('')}${ans?`<div class="feedback ${ans.correct?'ok':'bad'}"><strong>${ans.correct?'✓ Đúng rồi!':'✕ Chưa đúng'}</strong><p>${safe(p.why)}</p><b>Nghe lại và shadowing:</b> nghe một lượt → nhìn script, nhắc theo → che script và nói lại.</div>`:''}${source(p.book,p.page)}<div class="row" style="margin-top:18px">${btn('← Đoạn trước','prev-listen','soft')}${btn('Đoạn tiếp theo →','next-listen')}</div></div>`}
const makeDeck=()=>D.quiz.filter(q=>q.book==='kanji'&&q.topic==='Nghĩa Kanji');function flash(){setHeader('Flashcard Kanji','Lật thẻ, nhớ nghĩa và ôn lại những thẻ còn yếu');const deck=makeDeck(),item=deck[flashIndex%deck.length],id=item.q,grade=store.flash[id];dom.innerHTML=`<div class="quiz-wrap"><div class="row between" style="margin-bottom:16px"><div>${badge('Kanji N5 JF A2')} <span class="muted small">Thẻ ${flashIndex%deck.length+1}/${deck.length}</span></div><div class="small muted">Đã đánh giá: ${Object.keys(store.flash).length} thẻ</div></div><div class="card"><div class="flash-inner" data-act="flip-flash"><div><div class="mini" style="color:#7c85b3">${flashFlip?'ĐÁP ÁN & GIẢI THÍCH':'ĐỌC CHỮ HÁN VÀ ĐOÁN NGHĨA'}</div><div class="jp" lang="ja">${safe(item.voice)}</div>${flashFlip?`<div class="answer">${safe(item.opts[item.a])}</div><p>${safe(item.why)}</p>`:'<p class="muted">Bấm vào thẻ để xem nghĩa và âm đọc</p>'}</div></div>${source('kanji',item.page)}<div class="flash-nav"><button class="btn soft" data-act="prev-flash">← Trước</button><button class="btn alt" data-act="speak-flash">🔊 Phát âm</button><button class="btn soft" data-act="next-flash">Sau →</button></div>${flashFlip?`<div class="row" style="justify-content:center;margin-top:17px">${btn('⚠ Chưa nhớ','flash-again','danger')}${btn('✓ Đã nhớ','flash-good')}</div>`:''}</div></div><p class="note">Thẻ lấy từ các mục Kanji đã tuyển chọn trong sách. Chức năng tự đánh giá theo hai mức; chưa triển khai thuật toán SRS đầy đủ.</p></div>`}
function builder(){setHeader('Ghép câu logic','Từ đích tiếng Việt → chọn thành phần → xây dựng câu tiếng Nhật');const item=D.builders[buildIndex%D.builders.length],tok=shuffle(item.tokens.map((t,i)=>({t,i})));if(!window.buildShuffle||window.buildShuffleKey!==buildIndex){window.buildShuffle=tok;window.buildShuffleKey=buildIndex}const tokens=window.buildShuffle;const result=buildResult;dom.innerHTML=`<div class="card quiz-wrap"><div class="row between">${badge(bookName(item.book))}<strong>Bài ${buildIndex+1}/${D.builders.length}</strong></div><div class="question">${safe(item.vi)}</div><div class="small muted">Chọn các mảnh câu theo đúng thứ tự. Bấm mảnh trong câu đã ghép để bỏ chọn.</div><h3 class="section-title">Câu đang xây dựng</h3><div class="token-answer">${buildPicked.length?buildPicked.map((ix,j)=>`<button class="token token-picked" data-act="unpick-build" data-val="${j}">${safe(item.tokens[ix])}</button>`).join(''):'<span class="muted small">Chọn các mảnh bên dưới...</span>'}</div><h3 class="section-title">Các mảnh câu</h3><div class="token-pool">${tokens.map(x=>`<button class="token ${buildPicked.includes(x.i)?'used':''}" data-act="pick-build" data-val="${x.i}">${safe(x.t)}</button>`).join('')}</div><div class="row" style="margin-top:18px">${btn('Kiểm tra câu','check-build')}${btn('Làm lại','clear-build','soft')}</div>${result!==null?`<div class="feedback ${result?'ok':'bad'}"><strong>${result?'✓ Chính xác!':'✕ Cần xem lại thứ tự câu.'}</strong><p><b>Câu chuẩn:</b> <span lang="ja">${safe(item.tokens.join(''))}</span></p><p><b>Phân tích:</b> ${safe(item.why)}</p><button class="btn alt" data-act="speak-build">🔊 Nghe câu chuẩn</button></div>`:''}${source(item.book,item.page)}<div class="row" style="margin-top:20px">${btn('← Bài trước','prev-build','soft')}${btn('Bài tiếp theo →','next-build')}</div></div>`}
function reader(){setHeader('Thư viện 3 giáo trình','Tra cứu văn bản các trang và mở đúng trang PDF gốc');dom.innerHTML=`<div class="card"><div class="row"><div class="field" style="flex:3"><label>Tìm kiếm (tiếng Nhật / tiếng Việt)</label><input id="searchReader" placeholder="Ví dụ: あります, 水, かいさつ, 先生…" value="${safe(readerQuery)}"></div><div class="field"><label>Giáo trình</label><select id="readerBook"><option value="all">Cả 3 PDF</option>${D.books.map(b=>`<option value="${b.id}" ${readerBook===b.id?'selected':''}>${safe(b.title)}</option>`).join('')}</select></div><div style="align-self:end">${btn('Tìm trang','do-search')}</div></div><p class="note">Hệ thống đã lập chỉ mục ${D.books.reduce((n,b)=>n+b.pages,0)} trang PDF. Một số trang Kanji và Bài 7 là ảnh nên không có đủ chữ để tìm. Dùng nút PDF để xem toàn bộ nội dung gốc.</p></div><div id="results"></div>`;renderSearch()}
function renderSearch(){const q=readerQuery.trim().toLowerCase(),res=[];for(const b of D.books){if(readerBook!=='all'&&readerBook!==b.id)continue;for(const p of D.pages[b.id]){if(q&&p.t.toLowerCase().includes(q))res.push({b,p});else if(!q&&p.p<=4)res.push({b,p})}}const el=$('#results');if(!el)return;el.innerHTML=`<div class="row between" style="margin:18px 0"><b>${q?`${res.length} trang khớp`:'Trang xem trước'}</b><span class="muted small">Hiển thị tối đa 35 kết quả</span></div>`+(!res.length?'<div class="empty">Không tìm thấy trong văn bản đã trích xuất. Hãy thử mở PDF gốc để xem trang dạng ảnh.</div>':res.slice(0,35).map(({b,p})=>`<div class="reader-result"><strong>${safe(b.title)} · Trang ${p.p}</strong><pre>${safe(p.t.slice(0,1350)||'[Trang chủ yếu chứa hình ảnh — xem PDF gốc]')}</pre>${source(b.id,p.p)}</div>`).join(''))}
function progress(){setHeader('Tiến bộ & phân tích lỗi sai','Theo dõi câu đã làm và ôn lại đúng chỗ còn yếu');const c=counts(),hist=recent(),wrong=hist.filter(h=>!h.correct),groups={};wrong.forEach(x=>{groups[x.topic]=(groups[x.topic]||0)+1});const sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);dom.innerHTML=`<div class="stats"><div class="stat"><div class="sticon">☑</div><strong>${c.all}</strong><small>Câu đã trả lời</small></div><div class="stat"><div class="sticon">🌱</div><strong>${c.correct}</strong><small>Trả lời đúng</small></div><div class="stat"><div class="sticon">⚑</div><strong>${c.wrong}</strong><small>Lượt trả lời sai</small></div><div class="stat"><div class="sticon">◉</div><strong>${c.all?Math.round(c.correct/c.all*100):0}%</strong><small>Độ chính xác</small></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Chuyên đề cần ôn</h3>${sorted.length?sorted.slice(0,12).map(([k,n])=>`<div style="margin:13px 0"><div class="row between"><span>${safe(k)}</span><b>${n} lỗi</b></div><div class="progress" style="margin-top:7px"><div style="width:${Math.round(n/sorted[0][1]*100)}%;background:#e57383"></div></div></div>`).join(''):'<p>Chưa có lỗi. Hãy làm bài kiểm tra đầu tiên!</p>'}</div><div class="card"><h3>Chiến lược sửa lỗi</h3><p><b>1. Xác định:</b> vì sao câu vừa sai và thuộc chủ đề gì?</p><p><b>2. Truy ngược:</b> cần hiểu từ vựng, Kanji hay trợ từ nào?</p><p><b>3. Đối chiếu:</b> mở đúng trang PDF đã dẫn.</p><p><b>4. Thực hành:</b> tự nói lại và làm thêm câu có cùng cấu trúc.</p><div class="row">${btn('Ôn các câu sai','retry-wrong')}${btn('Xóa tiến độ','clear-progress','danger')}</div></div></div><h2 class="section-title">Nhật ký các câu sai gần nhất</h2><div class="card tablewrap">${wrong.length?`<table><thead><tr><th>Kiến thức</th><th>Câu hỏi</th><th>Đã chọn</th><th>Nguồn</th></tr></thead><tbody>${wrong.slice(0,45).map(x=>`<tr><td>${safe(x.topic)}</td><td>${safe(x.question)}</td><td>${safe(x.answer)}</td><td><a href="${encodeURI(D.books.find(b=>b.id===x.book).file)}#page=${x.page}" target="_blank">Trang ${x.page} ↗</a></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Không có dữ liệu lỗi sai.</div>'}</div>`}
function startQuiz(onlyWrong=false){const id=onlyWrong?'all':($('#quizBook')?.value||book),n=+(onlyWrong?50:($('#quizCount')?.value||20)),mode=onlyWrong?'wrong':($('#quizMode')?.value||'all');let pool=D.quiz.filter(q=>id==='all'||q.book===id);if(mode==='wrong'){const keys=new Set(store.history.filter(x=>!x.correct).map(x=>x.question));pool=pool.filter(q=>keys.has(q.q));if(!pool.length){toast('Chưa có câu sai để ôn. Hãy luyện tập tổng hợp trước.');return}}quizState={items:shuffle(pool).slice(0,n),idx:0,answers:[]};book=id;view('quiz')}
function clickAct(act,v){const s=quizState;if(act==='go-quiz'){quizState=null;view('quiz')}else if(act==='go-listen')view('listen');else if(act==='go-build')view('build');else if(act==='go-progress')view('progress');else if(act.startsWith('book-')){book=act.slice(5);quizState=null;view('quiz')}else if(act.startsWith('read-')){readerBook=act.slice(5);readerQuery='';view('reader')}else if(act==='start-quiz')startQuiz();else if(act==='reset-quiz'){quizState=null;view('quiz')}else if(act==='pick-quiz'&&s){const q=s.items[s.idx];if(s.answers[s.idx])return;const pick=+v,correct=pick===q.a;s.answers[s.idx]={pick,correct};record('quiz',q,correct,q.opts[pick]);quiz()}else if(act==='next-quiz'){quizState.idx++;quiz()}else if(act==='speak-q')speak(s.items[s.idx].voice);else if(act==='play-listen')speak(D.passages[listenState.idx].dialogue,.85);else if(act==='play-slow')speak(D.passages[listenState.idx].dialogue,.67);else if(act==='toggle-script'){listenState.show=!listenState.show;listen()}else if(act==='pick-listen'){const p=D.passages[listenState.idx];if(listenState.answers[listenState.idx])return;const pick=+v,correct=pick===p.a;listenState.answers[listenState.idx]={pick,correct};record('listen',p,correct,p.options[pick]);listen()}else if(act==='prev-listen'||act==='next-listen'){listenState.idx=(listenState.idx+(act==='next-listen'?1:-1)+D.passages.length)%D.passages.length;listenState.show=false;listen()}else if(act==='flip-flash'){flashFlip=!flashFlip;flash()}else if(act==='next-flash'||act==='prev-flash'){flashIndex=(flashIndex+(act==='next-flash'?1:-1)+makeDeck().length)%makeDeck().length;flashFlip=false;flash()}else if(act==='speak-flash')speak(makeDeck()[flashIndex%makeDeck().length].voice);else if(act==='flash-again'||act==='flash-good'){let q=makeDeck()[flashIndex%makeDeck().length];store.flash[q.q]={grade:act==='flash-good'?'remember':'again',date:new Date().toISOString()};persist();flashIndex=(flashIndex+1)%makeDeck().length;flashFlip=false;flash()}else if(act==='pick-build'){if(!buildPicked.includes(+v)){buildPicked.push(+v);buildResult=null;builder()}}else if(act==='unpick-build'){buildPicked.splice(+v,1);buildResult=null;builder()}else if(act==='clear-build'){buildPicked=[];buildResult=null;builder()}else if(act==='check-build'){let q=D.builders[buildIndex],correct=buildPicked.length===q.tokens.length&&buildPicked.every((x,i)=>x===i);buildResult=correct;record('builder',q,correct,buildPicked.map(i=>q.tokens[i]).join(''));builder()}else if(act==='speak-build')speak(D.builders[buildIndex].tokens.join(''));else if(act==='prev-build'||act==='next-build'){buildIndex=(buildIndex+(act==='next-build'?1:-1)+D.builders.length)%D.builders.length;buildPicked=[];buildResult=null;builder()}else if(act==='do-search'){readerQuery=$('#searchReader')?.value||'';readerBook=$('#readerBook')?.value||'all';renderSearch()}else if(act==='retry-wrong'){quizState=null;startQuiz(true)}else if(act==='clear-progress'){if(confirm('Xóa lịch sử trả lời và đánh giá thẻ trên thiết bị này?')){store={history:[],flash:{}};persist();progress()}}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){quizState=null;view(b.dataset.page)}});document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)clickAct(b.dataset.act,b.dataset.val)});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='searchReader'){readerQuery=e.target.value;readerBook=$('#readerBook')?.value||'all';renderSearch()}});document.addEventListener('change',e=>{if(e.target.id==='readerBook'){readerBook=e.target.value;readerQuery=$('#searchReader')?.value||'';renderSearch()}});view('dashboard');})();
</script></body></html>
